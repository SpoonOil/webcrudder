{% extends "base.html" %}
{% block content %}

    <form action="/contacts" method="get" class="tool-bar">
        <label for="search">Search For</label>
        <input type="search" name="q" id="search" value = "{{request.args.get('q') or ''}}" />
        <input type="submit" value="Search">
    </form>
    <table>
        <thead>
            <tr>
                <th>First </th>
                <th>Last </th>
                <th>Email </th>
                <th>Phone </th>
            </tr>
        </thead>
        <tbody> 
            {% for contact in contacts %}
            <tr>
                <td>{{contact.first}}</td>
                <td>{{contact.last}}</td>
                <td>{{contact.phone}}</td>
                <td>{{contact.email}}</td>
                <td><a href="/contacts/{{contact.id}}/edit">Edit</a>
                <a href="/contacts/{{ contact.id}}">View</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p>
        <a href="/contacts/new">Add Contact</a>
    </p>

{% endblock %}
